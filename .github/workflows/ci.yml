name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest line still offered by GitHub-hosted runners (Crescendo itself supports 3.6+)
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install a virtual display for Tk tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Engine tests
        run: xvfb-run -a python -B scripts/run_tests.py
      - name: Crescendo tests
        run: xvfb-run -a python -B -m unittest discover -s crescendo_tests -t .
      - name: Version and environment report
        run: python -B -m crescendo --version && python -B -m crescendo doctor > /dev/null
